services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sport}
      POSTGRES_DB: sport
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sport -d sport"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgres://sport:${POSTGRES_PASSWORD:-sport}@db:5432/sport
      REDIS_URL: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost}
      SPORTS_PROVIDER: ${SPORTS_PROVIDER:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://sport:${POSTGRES_PASSWORD:-sport}@db:5432/sport
      REDIS_URL: redis://redis:6379
      SPORTS_PROVIDER: ${SPORTS_PROVIDER:-mock}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # one-shot migrations + seed (profile: setup)
  setup:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgres://sport:${POSTGRES_PASSWORD:-sport}@db:5432/sport
      SPORTS_PROVIDER: ${SPORTS_PROVIDER:-mock}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "./node_modules/.bin/drizzle-kit migrate && ./node_modules/.bin/tsx src/db/seed.ts"]
    profiles: ["setup"]
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  db-data:
