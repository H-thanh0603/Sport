services:
  # production: multiple app replicas behind nginx
  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      AUTH_SECRET: ${AUTH_SECRET:?required}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      SPORTS_PROVIDER: ${SPORTS_PROVIDER:-mock}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    deploy:
      replicas: ${APP_REPLICAS:-3}
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped
    expose:
      - "3000"

  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      SPORTS_PROVIDER: ${SPORTS_PROVIDER:-mock}
    deploy:
      replicas: 1
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: unless-stopped
